media:
  input: public/images
  output: /images

content:
  - name: work
    label: My work
    type: collection
    path: src/content/work
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Section
        type: select
        required: true
        options:
          values:
            - words
            - sounds
            - stories
            - moments
      - name: date
        label: Date
        type: date
      - name: excerpt
        label: Short introduction
        type: text
      - name: cover
        label: Cover image
        type: image
      - name: featured
        label: Show in portfolio
        type: boolean
      - name: status
        label: Publishing status
        type: select
        required: true
        options:
          values:
            - draft
            - published
      - name: body
        label: Full content
        type: rich-text

  - name: site
    label: Website text & links
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: tagline
        label: Brand tagline
        type: string
      - name: home_eyebrow
        label: Homepage small heading
        type: string
      - name: home_headline
        label: Homepage main heading
        type: string
      - name: home_intro
        label: Homepage introduction
        type: text
      - name: bio_heading
        label: About section heading
        type: string
      - name: bio_text
        label: First-person bio
        type: text
      - name: profile_image
        label: Profile photograph
        type: image
      - name: instagram
        label: Instagram profile URL
        type: string
      - name: spotify
        label: Spotify artist URL
        type: string
      - name: substack
        label: Substack publication URL
        type: string
